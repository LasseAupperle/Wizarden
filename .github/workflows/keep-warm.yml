name: Keep server warm

# Spec §24.1: Render's free tier sleeps after ~15 min idle, so the first player
# then waits ~50s for a cold start. Ping /health every 14 min during likely play
# hours only (≈10:00–01:00 Europe/Amsterdam), which keeps usage (~16 h/day ≈
# 480 h/month) inside Render's 750 free instance-hours.
#
# Notes:
# - Cron is UTC. 08–23 UTC ≈ 10:00–01:00 CEST / 09:00–00:00 CET.
# - GitHub may delay scheduled runs by a few minutes under load, and pauses
#   scheduled workflows after 60 days without repo activity (re-enable it in the
#   Actions tab if that happens).
# - Override the target with a repo variable KEEP_WARM_URL if the Render URL changes.
on:
  schedule:
    - cron: '*/14 8-23 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          URL: ${{ vars.KEEP_WARM_URL || 'https://wizarden-server.onrender.com/health' }}
        # Generous timeout + retries: a sleeping instance can take ~50s to wake.
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 "$URL"
